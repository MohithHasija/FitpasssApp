
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" href="fitpassicon.jpeg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FitPass Home</title>
<style>
  :root{
    --bg-top:#a4d5fd;
    --bg-mid:#dbeefe;
    --bg-bottom:#ffffff;
    --green:#0f9a12;
    --green-dark:#0c7d0f;
    --blue:#2f6bff;
    --blue-dark:#1f4fd6;
    --red:#e5453c;
    --ink:#111318;
    --ink-soft:#5b6270;
    --card-line:#eef0f3;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:#000;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    color:var(--ink);
  }
  .frame{
    position:relative;
    width:100%;
    max-width:430px;
    height:100vh;
    height:100dvh;
    margin:0 auto;
    overflow:hidden;
    background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 22%,var(--bg-bottom) 46%,var(--bg-bottom) 100%);
    display:flex;
    flex-direction:column;
  }
  .page-screen{flex:1;display:flex;flex-direction:column;min-height:0;}
  .page-screen.hidden{display:none;}
  .statusbar{
    height:env(safe-area-inset-top,24px);
    flex-shrink:0;
  }

  /* ---------- Scroll area ---------- */
  .scroll{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-bottom:96px;
  }
  .scroll::-webkit-scrollbar{display:none;}

  /* ---------- Header ---------- */
  .header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:10px 18px 14px;
  }
  .loc{
    display:flex;
    align-items:flex-start;
    gap:8px;
  }
  .loc-pin{
    width:26px;height:26px;border-radius:50%;
    background:#ffffff;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
  }
  .loc-text .row1{
    display:flex;align-items:center;gap:4px;
    font-size:17px;font-weight:700;color:var(--ink);
  }
  .loc-text .row2{
    font-size:12.5px;color:var(--ink-soft);margin-top:2px;font-weight:500;
  }
  .header-right{
    display:flex;align-items:center;gap:8px;
  }
  .coin-pill{
    display:flex;align-items:center;gap:5px;
    background:#ffffff;
    border-radius:20px;
    padding:6px 10px;
    box-shadow:0 2px 6px rgba(0,0,0,0.06);
    font-size:13px;font-weight:700;color:var(--ink);
  }
  .avatar{
    width:34px;height:34px;border-radius:50%;
    background:#e7c9a9;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
    overflow:hidden;
  }

  /* ---------- Promo cards ---------- */
  .promo-row{
    display:flex;gap:12px;
    padding:0 18px 22px;
  }
  .promo-card{
    flex:1;
    background:#ffffff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 6px 18px rgba(20,30,60,0.08);
    padding:0;
    display:flex;
  }
  .promo-card img{
    width:100%;
    height:auto;
    display:block;
  }
  .promo-thumb{
    height:64px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-size:22px;
  }
  .promo-thumb.nutrition{background:linear-gradient(120deg,#eef8ea,#e3f3e6);}
  .promo-thumb.exercise{background:linear-gradient(120deg,#232733,#3a3f4d);}
  .promo-title{font-size:13px;color:var(--ink);font-weight:600;line-height:1.3;}
  .promo-title b{display:block;font-size:15px;font-weight:800;}
  .promo-title.nutrition b{color:var(--green);}
  .promo-title.exercise b{color:var(--blue);}
  .promo-btn{
    border:none;
    border-radius:22px;
    padding:10px 0;
    font-size:14px;
    font-weight:700;
    color:#fff;
    width:100%;
    cursor:pointer;
  }
  .promo-btn.green{background:linear-gradient(180deg,var(--green),var(--green-dark));}
  .promo-btn.blue{background:linear-gradient(180deg,var(--blue),var(--blue-dark));}

  /* ---------- Icon grid ---------- */
  .icon-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    row-gap:22px;
    padding:0 14px 26px;
  }
  .icon-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    background:none;
    border:none;
    cursor:pointer;
    position:relative;
  }
  .icon-circle{
    width:64px;height:64px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(20,30,60,0.10);
    overflow:hidden;
  }
  .icon-circle img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }
  .icon-circle.store{background:linear-gradient(145deg,#fdeee0,#fbe2cb);}
  .icon-label{font-size:12px;font-weight:600;color:var(--ink);}
  .sale-badge{
    position:absolute;top:-6px;right:2px;
    background:#c9b8ff;
    color:#3a2a7a;
    font-size:8.5px;font-weight:800;
    padding:2px 7px;
    border-radius:8px;
    letter-spacing:0.3px;
  }

  /* ---------- Mind section ---------- */
  .section-title{
    font-size:21px;font-weight:800;color:var(--ink);
    padding:4px 18px 14px;
  }
  .mind-row{
    display:flex;
    gap:12px;
    padding:0 18px 22px;
    overflow-x:auto;
    scroll-snap-type:x proximity;
  }
  .mind-row::-webkit-scrollbar{display:none;}
  .mind-card{
    position:relative;
    flex:0 0 118px;
    height:190px;
    border-radius:18px;
    overflow:hidden;
    scroll-snap-align:start;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(20,30,60,0.10);
    padding:0;
    border:none;
    background:#eee;
  }
  .mind-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  /* ---------- Cart pill ---------- */
  .cart-pill{
    position:absolute;
    right:16px;
    bottom:128px;
    background:#fff;
    border-radius:16px;
    padding:8px 14px 6px;
    box-shadow:0 8px 20px rgba(20,30,60,0.18);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    z-index:20;
    cursor:pointer;
    border:none;
  }
  .cart-pill .lbl{font-size:9px;font-weight:800;letter-spacing:0.3px;color:var(--ink);}

  /* ---------- Rate workout ---------- */
  .rate-row{
    display:block;
    margin:0 18px 8px;
    padding:0;
    background:#fff;
    border-radius:16px;
    box-shadow:0 4px 14px rgba(20,30,60,0.06);
    cursor:pointer;
    border:none;
    width:calc(100% - 36px);
    overflow:hidden;
  }
  .rate-row img{
    width:100%;
    height:auto;
    display:block;
  }
  .rate-icon{
    width:38px;height:38px;border-radius:50%;
    background:#1c1c1c;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .rate-text .t1{font-size:14.5px;font-weight:700;color:var(--ink);}
  .rate-text .t2{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .rate-row .chev{margin-left:auto;color:#b7bcc6;}

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:absolute;
    left:0;right:0;bottom:0;
    background:#ffffff;
    border-top:1px solid var(--card-line);
    padding:10px 8px calc(10px + env(safe-area-inset-bottom,10px));
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    z-index:30;
  }
  .nav-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    background:none;border:none;cursor:pointer;
    color:#8b909c;
    font-size:10.5px;
    font-weight:600;
    padding:2px 0;
  }
  .nav-item.active{color:var(--red);}
  .nav-plus{
    flex:1;
    display:flex;
    justify-content:center;
    margin-top:-26px;
  }
  .nav-plus button{
    width:52px;height:52px;
    border-radius:50%;
    background:linear-gradient(160deg,#ef564c,#d5352b);
    border:5px solid #fff;
    box-shadow:0 6px 16px rgba(213,53,43,0.45);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }

  /* ---------- Toast ---------- */
  #toast{
    position:absolute;
    left:50%;bottom:96px;
    transform:translateX(-50%) translateY(16px);
    background:rgba(17,19,24,0.94);
    color:#fff;
    padding:9px 16px;
    border-radius:20px;
    font-size:12.5px;
    font-weight:700;
    opacity:0;
    pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
    z-index:60;
    white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .detail-screen{
    padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(180deg,#ffffff 0%,#f5fff6 45%,#7fdc7b 100%);
    gap:16px;
  }
  .detail-topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding-top:6px;
  }
  .back-btn{
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:#fff;
    box-shadow:0 4px 12px rgba(20,30,60,0.12);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    cursor:pointer;
    color:var(--ink);
  }
  .detail-title{
    font-size:18px;
    font-weight:800;
    color:var(--ink);
  }
  .detail-content{
    display:flex;
    flex-direction:column;
    gap:14px;
    flex:1;
    overflow:auto;
  }
  .detail-content img{
    width:100%;
    border-radius:20px;
    box-shadow:0 8px 24px rgba(20,30,60,0.12);
    display:block;
  }
  .detail-copy{
    background:#fff;
    border-radius:18px;
    padding:16px;
    box-shadow:0 6px 16px rgba(20,30,60,0.08);
  }
  .detail-copy h2{
    font-size:20px;
    margin-bottom:8px;
    color:var(--ink);
  }
  .detail-copy p{
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.5;
  }
</style>
</head>

<script>
  function tap(label){
    const toast = document.getElementById('toast');
    toast.textContent = label;
    toast.classList.add('show');
    clearTimeout(window.__t);
    window.__t = setTimeout(()=>toast.classList.remove('show'), 1000);
  }

  function showHomePage(){
    document.getElementById('home-screen').classList.remove('hidden');
    document.getElementById('detail-screen').classList.add('hidden');
  }

  function showDetailPage(){
    const detailImage = document.getElementById('detail-image');
    if (detailImage) {
      detailImage.src = 'sessionstarted.jpeg';
      detailImage.alt = 'Session started';
    }
    document.getElementById('home-screen').classList.add('hidden');
    document.getElementById('detail-screen').classList.remove('hidden');
  }

  function openWorkoutPage(label){
    tap(label);
    showDetailPage();
    history.pushState({ page: 'detail' }, '', '#workout');
  }

  function goHome(){
    if (window.history.state && window.history.state.page === 'detail') {
      window.history.back();
    } else {
      showHomePage();
    }
  }

  window.addEventListener('popstate', function(){
    if (location.hash === '#workout') {
      showDetailPage();
    } else {
      showHomePage();
    }
  });

  if (location.hash === '#workout') {
    showDetailPage();
  }
</script>
